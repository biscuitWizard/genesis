# Genesis configuration.
#
# Every setting below is optional — delete this file entirely and Genesis still
# runs on its built-in defaults. Environment variables override anything here,
# which is what makes per-run tweaks and secrets easy.
#
# A mistyped key is a startup error rather than a setting that quietly does
# nothing, so if Genesis refuses to boot, read the message: it names the key.

[server]
bind = "127.0.0.1:7777"
# Which gateway component serves the browser UI. The crate is expected at
# <paths.gateways>/<paths.gateway_prefix><name>.
primary_gateway = "web"
# The host-rendered recovery console. Keep it on: it is the control surface
# that still works when every WebAssembly guest is broken.
admin_enabled = true

[paths]
# All relative paths are resolved against the project root (the directory
# holding this file). Absolute paths are used as given.
data = "data"
artifacts = "artifacts"
skills = "skills"
templates = "templates"
wit = "wit"
agent = "agents/agent-core"
gateways = "gateways"
gateway_prefix = "gateway-"
tools = "tools"
tool_prefix = ""
# A slot's directory name is also its cargo package name, which is how the
# built component's filename is derived. Keep the two in step.

[llm]
base_url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-sonnet-4.5"
request_timeout_secs = 180
max_retries = 3
# Your OpenRouter key. OPENROUTER_API_KEY overrides this when set, so you can
# keep a key here for convenience and still override it per run.
#
# A real key in this file is a real key on disk: .gitignore already excludes
# genesis.local.toml, so point GENESIS_CONFIG at one of those if this file is
# ever going into version control.
# api_key = "sk-or-..."

[agent]
# Tool-call rounds allowed in a single turn.
max_iterations = 32
default_mode = "agent"
# The system prompt. Use `system_prompt_file` to keep it in its own file
# (recommended once it grows), or `system_prompt` for a short inline one.
# Leaving both empty uses the built-in prompt.
# system_prompt_file = "prompts/system.md"

# Models offered in the chat surface's picker. Providers change their
# catalogues often, so this is the first thing worth editing.
[[models]]
id = "anthropic/claude-sonnet-4.5"
label = "Claude Sonnet 4.5"

[[models]]
id = "anthropic/claude-opus-4.1"
label = "Claude Opus 4.1"

[[models]]
id = "openai/gpt-4o"
label = "GPT-4o"

[[models]]
id = "google/gemini-2.5-pro"
label = "Gemini 2.5 Pro"

# Ways of working, offered per conversation. `read_only` is carried through to
# the agent, which withholds every tool that changes something — so adding a
# mode here needs no agent code.
[[modes]]
id = "agent"
label = "Agent"
description = "Full access. Runs tools and can modify the running system."
read_only = false

[[modes]]
id = "plan"
label = "Plan"
description = "Reads and reasons, but makes no changes. Tools that would modify anything are withheld."
read_only = true
# Appended to the system prompt while this mode is active. read_only decides
# which tools are offered; this decides what the model does with them. Without
# it the model just finds the tools missing and works around the gap.
prompt = """
You are in Plan mode. Every tool that would change something is withheld, so \
you cannot edit code, run commands, or modify the running system. Read and \
reason only.

Produce a plan, not an implementation:
- Investigate first with the read-only tools you do have. A plan written \
without looking at the code is a guess.
- Say what you would change, file by file, and why each change is needed.
- Name the decisions that are the user's to make, and the risks worth checking \
before starting.
- Sketch the shape of code rather than writing it out in full. You cannot \
compile it here, and untested code reads as more certain than it is.

If you find yourself wanting a tool that is not offered, say what you would \
have done with it instead of quietly working around it. When the plan is ready, \
say so plainly and stop; the user will switch to Agent mode to carry it out.
"""

# Summarizing a long conversation down, so it can keep going past the window.
#
# The trigger is the provider's own usage.prompt_tokens from the last turn - the
# entire input it saw, system prompt and tool schemas included - so it measures
# what actually costs money rather than estimating one part of it.
[context]
enabled = true
# Assumed usable window. Deliberately under any real one: compaction should
# happen well before the provider starts refusing, not at the cliff edge.
window_tokens = 200000
# Compact when the context passes this fraction of the window...
compact_threshold = 0.6
# ...and shed until it is back under this one. Summarizing stops at the first
# round boundary that gets under the target, so a long conversation sheds what
# it must and keeps the rest.
compact_target = 0.25
# A cheaper model for the summaries themselves. Empty uses the session's model.
# summary_model = "anthropic/claude-haiku-4.5"
summary_model = ""
# Never summarized: the opening messages, which everything after them refers
# back to, and the most recent ones, which are the agent's working memory. User
# messages are never summarized either, wherever they sit.
keep_head = 4
keep_tail = 30

[budgets]
# Longest a guest may run without returning to a blocking host call. This is
# what catches an infinite loop; it does not punish slow model calls, because
# time parked in a host import does not count against it.
#
# There is deliberately no ceiling on how long a whole turn may take. A turn
# that streams a long answer, runs a dozen tools and compiles something is doing
# its job, and a fixed number of seconds cannot tell that apart from a hang.
wasm_slice_secs = 10
tool_secs = 30
probe_secs = 5

[limits]
agent_memory_mb = 512
tool_memory_mb = 128
gateway_memory_mb = 128
# Per-conversation spend ceiling in USD. 0 disables the check.
session_spend_limit_usd = 0.0
# Tool and exec output is truncated to this before it reaches the model.
max_tool_output_bytes = 32768
max_attachment_bytes = 8388608
max_attachments = 8

# Prompt caching. Providers differ in kind, not just in syntax: Anthropic
# caches nothing unless the request marks where, while OpenAI and Google cache
# long prefixes on their own. Marking a moving prefix on a provider that already
# caches would bill writes for nothing, so only the vendors listed here get
# explicit breakpoints.
[cache]
enabled = true
# "5m" or "1h". The longer one costs twice as much to write, and is worth it
# only if gaps between turns regularly exceed five minutes.
ttl = "5m"
# Spacing of the stable anchor breakpoints in the message list. A cache read
# looks back at most twenty blocks, so a turn that runs many tools can overshoot
# the previous mark; the anchors hold still and stay within reach. Smaller means
# more resilience and more writes.
anchor_stride = 8
explicit_vendors = ["anthropic"]

[build]
command = "cargo"
target = "wasm32-wasip2"
profile = "release"
# Shared cargo target directory, so guests compile their dependencies once.
target_dir = "target-wasm"
# Pass --locked when a lockfile exists, keeping dependency resolution
# reproducible for builds the agent triggers.
locked = true
extra_args = []
# Ceiling on a single cargo invocation. Builds are serialized, so one that hangs
# would block every later build; this kills it and reports a failed compile
# instead. Raise it if a genuinely large dependency tree is being fetched.
timeout_secs = 900
# Crates guests are allowed to depend on. Empty means anything on crates.io.
# Populate it to restrict what the agent can pull in, e.g.
#   allowed_crates = ["regex", "serde", "chrono"]
allowed_crates = []

[wasi]
# Guests run on WASI preview 2, which grants nothing until it is told to. These
# are the grants. They apply to every guest; the component boundary and the
# memory ceiling are what actually contain a tool.
#
# Outbound sockets and wasi:http. A tool that talks to a web API needs both of
# these; TLS is terminated host-side, because no TLS crate builds for
# wasm32-wasip2 (ring and openssl both need a C toolchain targeting wasm).
network = true
dns = true
# The host's environment variables. Left off on purpose: OPENROUTER_API_KEY
# lives there, and a tool has no business reading it. Tool secrets belong in a
# [tools.<name>] block instead.
env = false
stdio = false
# Directories guests get as preopens, readable and writable. Relative paths
# resolve against the project root, and are created if missing.
dirs = ["workspace"]

[watchdog]
# Failures inside this window count toward the same circuit breaker.
failure_window_secs = 120
# Failures before a slot is rolled back to its last known-good revision.
failure_threshold = 3
probe_interval_secs = 30
# How long the file watcher ignores a slot the orchestrator just wrote to, so a
# rollback is not immediately rebuilt over.
watch_suppression_secs = 5
# Editors save in bursts; wait for the dust to settle before spending a compile.
debounce_ms = 500

[devkit]
# Whether the agent is offered the tools that modify the running system.
enabled = true
# Paths a component may not edit in its own source tree. Empty means it may edit
# anything, including its own Cargo.toml and build.rs — which is what adding a
# dependency or generating code requires.
#
# These were previously a hardcoded list that these keys did not actually
# control; they are honoured now. Fill them in only to hold a component still.
#   protected_files = ["Cargo.toml", "build.rs"]
protected_files = []
protected_dirs = []

[sandbox]
# The Docker exec sandbox. While off, the agent is simply not offered
# code-execution tools rather than being handed tools that always fail.
enabled = false

# Reading and writing files on this machine. Unlike [sandbox], these touch the
# host directly, so the roots below are the real boundary: every path the agent
# gives is resolved — symlinks included — and must land inside one of them.
[filesystem]
enabled = true
# Empty means the project root. Add more to widen what the agent can reach.
roots = []
max_read_bytes = 1048576
# Names that may not be written or deleted anywhere under a root. This keeps the
# system from destroying its own state by accident; it is not a security
# control, since a terminal session can reach these paths regardless.
protected = ["data", "artifacts", ".git"]
allow_delete = true

# Shell sessions on this machine. A session keeps its working directory and
# shell state between commands.
[terminal]
enabled = true
# Empty picks PowerShell on Windows and sh elsewhere.
shell = ""
shell_args = []
max_sessions = 4
default_timeout_ms = 30000
max_output_bytes = 65536
# Sessions idle longer than this are closed. 0 disables reaping.
idle_timeout_secs = 1800

# Per-tool settings. Each tool component is handed its own block as JSON when it
# is invoked, and never sees another's or anything else here. The shape is
# whatever that tool expects — put its API keys, endpoints and defaults here
# rather than hardcoding them in its source.
[tools.config-probe]
greeting = "hello from configuration"
retries = 3

[control]
# Whether the agent may restart the orchestrator. A restart is how changes to
# the native binary, or to settings only read at startup, take effect.
allow_restart = true
# Restarts are refused before this much uptime, so a restart that fails to fix
# anything cannot become a loop.
min_uptime_secs = 20
# Delay before the process replaces itself, so the turn finishes and the user
# reads why first.
restart_delay_ms = 1500
