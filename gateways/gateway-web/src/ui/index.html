<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='none' stroke='%237c9cff' stroke-width='2.5'/><circle cx='16' cy='16' r='3' fill='%237c9cff'/></svg>">
</head>
<body>
<div id="app">

  <aside class="sidebar">
    <header class="sidebar-head">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="16" cy="16" r="3" fill="currentColor"/>
        </svg>
        <span>Genesis</span>
      </div>
      <button id="new-chat" class="icon-btn" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <nav id="session-list" class="session-list" aria-label="Conversations"></nav>

    <footer class="sidebar-foot">
      <span id="status" class="status is-offline">connecting</span>
      <a href="/admin" target="_blank" rel="noopener" class="quiet-link">admin</a>
    </footer>
  </aside>

  <main class="main">
    <header class="chat-head">
      <div class="chat-title-wrap">
        <h1 id="chat-title" class="chat-title">—</h1>
        <span id="chat-sub" class="chat-sub"></span>
      </div>
      <div class="chat-actions">
        <button id="show-skills" class="ghost-btn" title="Skills attached to this conversation">Skills</button>
        <button id="show-tools" class="ghost-btn" title="Tools the agent can use here">Tools</button>
        <span class="chat-divider" aria-hidden="true"></span>
        <button id="rename-chat" class="ghost-btn" title="Rename this chat">Rename</button>
        <button id="archive-chat" class="ghost-btn" title="Archive this chat">Archive</button>
      </div>
    </header>

    <div id="transcript" class="transcript" tabindex="0"></div>

    <div class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <div id="attachments" class="attachments" hidden></div>

        <textarea id="input" class="composer-input" rows="1"
                  placeholder="Message Genesis…"
                  aria-label="Message"></textarea>

        <div class="composer-bar">
          <div class="composer-tools">
            <button type="button" id="attach" class="icon-btn sm" title="Attach an image" aria-label="Attach an image">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M13.5 7.5 8.7 12.3a2 2 0 0 0 2.8 2.8l5.2-5.2a3.6 3.6 0 0 0-5-5L5.6 10a5.2 5.2 0 0 0 7.4 7.4l4.2-4.2"
                      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <input type="file" id="file-input" accept="image/*" multiple hidden>

            <div id="mode-picker" class="picker"></div>
            <div id="model-picker" class="picker"></div>
          </div>

          <button id="send" type="submit" class="send-btn" title="Send" aria-label="Send">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 10h11M10.5 5.5 15 10l-4.5 4.5" fill="none" stroke="currentColor"
                    stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>
      <p class="composer-hint">Enter to send · Shift+Enter for a newline · paste or drop an image to attach</p>
    </div>

    <div id="drop-veil" class="drop-veil" hidden><span>Drop images to attach</span></div>
  </main>

</div>
<script type="module" src="/app.js"></script>
</body>
</html>
